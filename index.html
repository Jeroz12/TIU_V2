<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F9FAFE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TIU Virtual" />
  <link rel="manifest" href="manifest.json" />
  <title>TIU Virtual</title>

  <!-- Fuentes extraídas exactamente de index.html -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --red:      #E30613;   
      --dark:     #1a1a2e;
      --bg:       #F5F6FC;   
      --cloud:    #D7DBF7;   
      --navy:     #33475B;   
      --label:    #6B7A99;   
      --campus:   #4E6076;
      --clock-bg: #DCD9F9;   
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif; 
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 20px 20px;
      position: relative;
      overflow: hidden;
    }

    /* ══════════ APP BAR ══════════ */
    .app-bar {
      width: calc(100% + 40px);      
      margin: 0 -20px;
      padding: 6px 16px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      border-bottom: 1.5px solid #DDE3F0;   
      background: var(--bg);
      z-index: 2;
    }

    .back-btn {
      background: none; border: none;
      cursor: pointer;
      padding: 4px 6px 4px 2px;
      display: flex; align-items: center;
    }
    .back-btn svg { width: 26px; height: 26px; }

    .app-bar h1 {
      font-size: 18px;               
      font-weight: 545;              
      font-family: 'League Gothic', 'Bebas Neue', sans-serif; 
      letter-spacing: 1px;           
      color: #16181D;
      text-transform: uppercase;
    }

    /* ══════════ CONTENIDO ══════════ */
    .content {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 30px;               
      padding-top: 22px;
      z-index: 1;
    }

    /* ══════════ RELOJ ══════════ */
    .clock-wrap { text-align: center; }

    .clock-box {
      display: inline-block;
      background: var(--clock-bg);
      border-radius: 10px;
      padding: 8px 34px;
    }

    .clock-time {
      font-size: 38px;               
      font-weight: normal;           
      color: #000;
      font-family: 'Arimo', Arial, sans-serif; 
      letter-spacing: 1px;           
      font-variant-numeric: tabular-nums;  
    }

    .clock-date {
      margin-top: 14px;
      font-size: 17px;               
      font-weight: 450;              
      color: #5D6C7B;
      font-family: 'Arimo', Arial, sans-serif; 
      text-align: center;
    }

    /* ══════════ FOTO ══════════ */
    .photo-wrap {
      width: 138px; height: 138px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #fff;
    }
    .photo-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ══════════ NUBES ══════════ */
    .clouds {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .cloud {
      position: absolute;
      background: var(--cloud);
      border-radius: 999px;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud::before {
      width: 55%; height: 160%;
      bottom: 45%; left: 14%;
    }
    .cloud::after {
      width: 38%; height: 110%;
      bottom: 45%; right: 16%;
    }

    .c1 { width: 88px;  height: 22px; top: 46%; left: 34%; }
    .c2 { width: 58px;  height: 15px; top: 48.5%; right: 6%; opacity: .85; }
    .c3 { width: 60px;  height: 16px; top: 51%; left: 4%;  opacity: .8; }
    .c4 { width: 110px; height: 24px; top: 56%; left: -30px; opacity: .55; }
    .c5 { width: 70px;  height: 18px; top: 55%; right: -12px; opacity: .5; }
    
    .bubble {
      position: absolute;
      width: 130px; height: 130px;
      border-radius: 50%;
      background: #E3E6FA;
      top: 60%; left: -70px;
      opacity: .8;
    }
    
    .ground {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 26%;
      background: #E9EBFA;
      opacity: .65;
    }

    /* ══════════ TARJETA ══════════ */
    .card {
      background: #fff;
      border-radius: 26px;
      width: 100%;
      max-width: 360px;
      padding: 26px 26px 28px;
      box-shadow: 0 10px 30px rgba(40, 50, 90, 0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .name-line {
      font-size: 40px;               
      font-weight: normal;           
      color: #E50A17;                
      line-height: 1.2;              
      text-align: center;
      font-family: 'League Gothic', 'Bebas Neue', sans-serif; 
      letter-spacing: 1px;           
    }

    .dato {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 16px;
    }

    .dato-label {
      font-size: 15px;               
      color: #6c7c99;                
      font-weight: 625;              
    }

    .dato-valor {
      margin-top: 6px;
      font-size: 18px;               
      font-weight: 900;              
      color: #3B4B62;                
      font-family: 'Arimo', Arial, sans-serif; 
      line-height: 1;                
    }

    .carrera-text {
      font-size: 17px;               
      font-weight: 750;              
      color: #3B4B62;                
      text-align: center;
      margin-top: 23px;              
    }

    .campus-row {
      display: flex;
      align-items: center;
      gap: 5px;                      
      margin-top: 8px;               
    }
    .campus-emoji { font-size: 16px; }
    .campus-text {
      font-size: 17px;               
      font-weight: 600;              
      color: #586886;                
    }

    /* ══════════ ANIMACIONES ══════════ */
    .card, .photo-wrap, .clock-wrap {
      animation: fadeUp .45s ease both;
    }
    .clock-wrap { animation-delay: .05s; }
    .photo-wrap { animation-delay: .15s; }
    .card       { animation-delay: .25s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════ BANNER PWA ══════════ */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 16px; left: 50%;
      transform: translateX(-50%);
      background: var(--dark);
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 999;
      white-space: nowrap;
      align-items: center;
      gap: 10px;
    }
    #install-banner.show { display: flex; }
  </style>
</head>

    <div class="card">
      <div class="name-line" id="nombre-linea1"></div>
      <div class="name-line" id="nombre-linea2" style="margin-top:2px;"></div>
      <div class="dato">
        <span class="dato-label">Código de alumno:</span>
        <span class="dato-valor" id="codigo"></span>
      </div>
      <div class="dato">
        <span class="dato-label">ID Banner:</span>
        <span class="dato-valor" id="banner"></span>
      </div>
      <div class="carrera-text" id="carrera"></div>
      <div class="campus-row">
        <span class="campus-emoji">📍</span>
        <span class="campus-text" id="campus"></span>
      </div>

</div>

<div id="install-banner">📲 Agregar a pantalla de inicio</div>

<script>
  /*Estructura de datos idéntica a index.html: Solo 2 apellidos de base*/
  const DATOS = {
    nombre:    "RUBY ELENA",
    apellido1: "ALOCEN",
    apellido2: "DE LA CRUZ", /* Segundo apellido compuesto */
    codigo:    "20221a994",
    id_banner: "N04317519",
    carrera:   "INGENIERIA INDUSTRIAL",
    campus:    "Campus San Miguel",
  };

  /* Función de censura que procesa palabras individuales */
  function censurarPalabra(palabra) {
    return palabra.length <= 1 ? palabra : palabra[0] + "***";
  }

  /* Función para procesar un apellido completo (si tiene espacios, censura cada parte) */
  function procesarApellido(apellidoCompleto) {
    return apellidoCompleto.split(" ").map(censurarPalabra).join(" ");
  }

  /* Inyección de textos en el DOM */
  document.getElementById("nombre-linea1").textContent = DATOS.nombre;
  
  /* Renderizado de la línea 2: Une ambos apellidos procesando cualquier compuesto */
  document.getElementById("nombre-linea2").textContent = 
    procesarApellido(DATOS.apellido1) + " " + procesarApellido(DATOS.apellido2);

  document.getElementById("codigo").textContent  = DATOS.codigo;
  document.getElementById("banner").textContent  = DATOS.id_banner;
  document.getElementById("carrera").textContent = DATOS.carrera;
  document.getElementById("campus").textContent  = DATOS.campus;

  const DIAS  = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent =
      String(now.getHours()).padStart(2,"0")+":"+
      String(now.getMinutes()).padStart(2,"0")+":"+
      String(now.getSeconds()).padStart(2,"0");
    document.getElementById("fecha").textContent =
      DIAS[now.getDay()]+", "+now.getDate()+" "+MESES[now.getMonth()]+" "+now.getFullYear();
  }
  tick();
  setInterval(tick, 1000);

  let deferredPrompt;
  const banner = document.getElementById("install-banner");
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferredPrompt = e; banner.classList.add("show");
  });
  banner.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === "accepted") banner.classList.remove("show");
    deferredPrompt = null;
  });
  window.addEventListener("appinstalled", () => banner.classList.remove("show"));

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
